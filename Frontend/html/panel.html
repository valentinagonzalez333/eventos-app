<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplicativo Web para la gestión de eventos (bodas, cumpleaños y reuniones)">
    <link rel="stylesheet" href="/css/menu.css">
    <script src="/js/sesion.js"></script>
    <link rel="stylesheet" href="/css/alertas.css">
    <script src="/js/alertas.js" defer></script>
    <link rel="stylesheet" href="/css/panel.css">
    <script src="/js/menu.js" defer></script>
    <title>Portal Eve</title>
</head>

<body>
    <header>
        <div class="logo">

        </div>

        </div>
        <div class="usuario">
        </div>

        <nav>
            <ul class="menu">
                <li>
                    <a href="/panel">
                        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                            <polyline points="9 22 9 12 15 12 15 22" />
                        </svg>
                        <span>Inicio</span>
                    </a>
                </li>
                <li>
                    <a href="/eventos">
                        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                        </svg>
                        <span>Eventos</span>
                    </a>
                </li>
                <li>
                    <a href="/calendario">
                        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                            <circle cx="12" cy="15" r="1" />
                            <circle cx="16" cy="15" r="1" />
                            <circle cx="8" cy="15" r="1" />
                        </svg>
                        <span>Calendario</span>
                    </a>
                </li>
                <li>
                    <a href="/configuracion">
                        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3" />
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                        </svg>
                        <span>Configuración</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="panel-bienvenida">
            <h1>Hola, bienvenido de nuevo</h1>
            <p>Este es el resumen de tus eventos.</p>
        </section>


        <section class="panel-tarjetas" id="panelTarjetas">
            <div class="tarjeta tarjeta--eventos">
                <div class="tarjeta-icono">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                        <line x1="16" y1="2" x2="16" y2="6" />
                        <line x1="8" y1="2" x2="8" y2="6" />
                        <line x1="3" y1="10" x2="21" y2="10" />
                    </svg>
                </div>
                <div class="tarjeta-info">
                    <span class="tarjeta-valor" id="totalEventos">–</span>
                    <span class="tarjeta-etiqueta">Eventos totales</span>
                </div>
            </div>

            <div class="tarjeta tarjeta--activos">
                <div class="tarjeta-icono">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                        <polyline points="22 4 12 14.01 9 11.01" />
                    </svg>
                </div>
                <div class="tarjeta-info">
                    <span class="tarjeta-valor" id="eventosActivos">–</span>
                    <span class="tarjeta-etiqueta">Eventos activos</span>
                </div>
            </div>

            <div class="tarjeta tarjeta--proximos">
                <div class="tarjeta-icono">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <polyline points="12 6 12 12 16 14" />
                    </svg>
                </div>
                <div class="tarjeta-info">
                    <span class="tarjeta-valor" id="proximosEventos">–</span>
                    <span class="tarjeta-etiqueta">Próximos (15 días)</span>
                </div>
            </div>

            <div class="tarjeta tarjeta--finalizados">
                <div class="tarjeta-icono">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M9 11l3 3L22 4" />
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
                    </svg>
                </div>
                <div class="tarjeta-info">
                    <span class="tarjeta-valor" id="eventosFinalizados">–</span>
                    <span class="tarjeta-etiqueta">Finalizados</span>
                </div>
            </div>
        </section>

        <section class="panel-proximos">
            <h2>Tus próximos eventos</h2>
            <div class="lista-proximos" id="listaProximos">
                <p class="panel-proximos-vacio">Cargando...</p>
            </div>
        </section>

        <p class="panel-error" id="panelError" hidden>
            No se pudo cargar el resumen. <button type="button" id="reintentar">Reintentar</button>
        </p>
    </main>

</body>

</html>
