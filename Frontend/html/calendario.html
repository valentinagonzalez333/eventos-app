<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplicativo Web para la gestión de eventos (bodas, cumpleaños y reuniones)">
    <link rel="stylesheet" href="/css/menu.css">
    <script src="/js/sesion.js"></script>
    <link rel="stylesheet" href="/css/alertas.css">
    <script src="/js/alertas.js" defer></script>
    <script src="/js/detallegeneral.js" defer></script>
    <link rel="stylesheet" href="/css/calendario.css">
    <script src="/js/menu.js" defer></script>
    <script src="/js/calendario.js" defer></script>

    <title>Portal Eve</title>
</head>

<body>
    <header>
        <div class="logo">
        </div>
        <div class="usuario">
        </div>

        <nav>
            <ul class="menu">
                <li>
                    <a href="/panel">
                        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                            <polyline points="9 22 9 12 15 12 15 22" />
                        </svg>
                        <span>Inicio</span>
                    </a>
                </li>
                <li>
                    <a href="/eventos">
                        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                        </svg>
                        <span>Eventos</span>
                    </a>
                </li>
                <li>
                    <a href="/calendario" class="activo">
                        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                            <circle cx="12" cy="15" r="1" />
                            <circle cx="16" cy="15" r="1" />
                            <circle cx="8" cy="15" r="1" />
                        </svg>
                        <span>Calendario</span>
                    </a>
                </li>
                <li>
                    <a href="/configuracion">
                        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3" />
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                        </svg>
                        <span>Configuración</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="contenido-calendario">

            <div class="calendario-encabezado">
                <div>
                    <p id="tituloCalendario">Calendario</p>
                    <p class="subtitulo-calendario">Todos tus eventos, mes a mes.</p>
                </div>

                <div class="calendario-controles">
                    <button type="button" class="btn-nav" id="btnMesAnterior" aria-label="Mes anterior">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6" />
                        </svg>
                    </button>
                    <span class="mes-actual" id="mesActual">—</span>
                    <button type="button" class="btn-nav" id="btnMesSiguiente" aria-label="Mes siguiente">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6" />
                        </svg>
                    </button>
                    <button type="button" class="btn-hoy" id="btnHoy">Hoy</button>
                </div>
            </div>

            <div class="calendario-card">
                <div class="calendario-semana">
                    <span>Lun</span>
                    <span>Mar</span>
                    <span>Mié</span>
                    <span>Jue</span>
                    <span>Vie</span>
                    <span>Sáb</span>
                    <span>Dom</span>
                </div>

                <div class="calendario-grid" id="calendarioGrid">
                    <p class="calendario-cargando">Cargando tus eventos…</p>
                </div>

                <div class="calendario-leyenda">
                    <span class="leyenda-item"><i class="punto activo"></i> Activo</span>
                    <span class="leyenda-item"><i class="punto finalizado"></i> Finalizado</span>
                    <span class="leyenda-item"><i class="punto cancelado"></i> Cancelado</span>
                </div>
            </div>

        </div>
    </main>

    <div class="modal-dia" id="modalDia">
        <div class="modal-dia-contenido">
            <button type="button" class="modal-cerrar" id="btnCerrarModalDia" aria-label="Cerrar">&times;</button>
            <p class="modal-dia-fecha" id="modalDiaFecha">—</p>
            <div class="modal-dia-lista" id="modalDiaLista"></div>
        </div>
    </div>

</body>

</html>
