<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplicativo Web para la gestión de eventos (bodas, cumpleaños y reuniones)">
    <link rel="stylesheet" href="/css/menu.css">
    <script src="/js/sesion.js"></script>
    <link rel="stylesheet" href="/css/alertas.css">
    <script src="/js/alertas.js" defer></script>
    <script src="/js/detallegeneral.js" defer></script>
    <link rel="stylesheet" href="/css/configuracion.css">
    <script src="/js/menu.js" defer></script>
    <script src="/js/configuracion.js" defer></script>

    <title>Portal Eve</title>
</head>

<body>
    <header>
        <div class="logo">
        </div>
        <div class="usuario">
        </div>

        <nav>
            <ul class="menu">
                <li>
                    <a href="/panel">
                        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                            <polyline points="9 22 9 12 15 12 15 22" />
                        </svg>
                        <span>Inicio</span>
                    </a>
                </li>
                <li>
                    <a href="/eventos">
                        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                        </svg>
                        <span>Eventos</span>
                    </a>
                </li>
                <li>
                    <a href="/calendario">
                        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                            <circle cx="12" cy="15" r="1" />
                            <circle cx="16" cy="15" r="1" />
                            <circle cx="8" cy="15" r="1" />
                        </svg>
                        <span>Calendario</span>
                    </a>
                </li>
                <li>
                    <a href="/configuracion" class="activo">
                        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3" />
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                        </svg>
                        <span>Configuración</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="contenido">
            <div class="topInfo">
                <p id="tituloConfig">Tu cuenta</p>
            </div>

            <div class="config-layout">

                <div class="tarjeta-perfil">

                    <aside class="perfil-rail">
                        <div class="avatar-usuario">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="8" r="4" />
                                <path d="M4 21v-1a8 8 0 0 1 16 0v1" />
                            </svg>
                        </div>
                        <div class="rail-nombre">
                            <span class="rail-usuario" id="railUsuario">—</span>
                            <span class="estado" id="railRol">—</span>
                        </div>

                        <nav class="rail-tabs">
                            <button type="button" class="tab-btn activo" data-tab="personal">
                                Información personal
                            </button>
                            <button type="button" class="tab-btn" data-tab="acceso">
                                Inicio de sesión
                            </button>
                            <button type="button" class="tab-btn tab-salir" id="btnCerrarSesion">
                                Cerrar sesión
                            </button>
                        </nav>
                    </aside>

                    <div class="perfil-panel">

                        <div class="perfil-vista" id="perfilVista">
                            <div class="panel-tab-contenido" data-panel="personal">
                                <h2 class="panel-titulo">Información personal</h2>
                                <div class="campos-grid">
                                    <div class="campo-box">
                                        <span class="etiqueta">Usuario</span>
                                        <span class="valor" id="verUsuario">—</span>
                                    </div>
                                    <div class="campo-box">
                                        <span class="etiqueta">Correo</span>
                                        <span class="valor" id="verCorreo">—</span>
                                    </div>
                                </div>
                            </div>

                            <div class="panel-tab-contenido" data-panel="acceso" hidden>
                                <h2 class="panel-titulo">Inicio de sesión</h2>
                                <div class="campos-grid">
                                    <div class="campo-box">
                                        <span class="etiqueta">Rol</span>
                                        <span class="estado" id="verRolAcceso">—</span>
                                    </div>
                                    <div class="campo-box">
                                        <span class="etiqueta">Contraseña</span>
                                        <span class="valor valor-mono">••••••••</span>
                                    </div>
                                </div>
                            </div>

                            <button type="button" class="btn-crear" id="btnEditarPerfil">Editar perfil</button>
                        </div>

                        <form class="perfil-edicion" id="formPerfil">
                            <div class="panel-tab-contenido" data-panel="personal">
                                <h2 class="panel-titulo">Información personal</h2>
                                <label>Usuario
                                    <input type="text" id="editUsuario" autocomplete="username" minlength="3" maxlength="30">
                                </label>
                            </div>

                            <div class="panel-tab-contenido" data-panel="acceso" hidden>
                                <h2 class="panel-titulo">Cambiar contraseña</h2>
                                <label>Contraseña actual
                                    <input type="password" id="passActual" autocomplete="current-password"
                                        placeholder="Solo si vas a cambiarla">
                                </label>
                                <div class="campo-fila">
                                    <label>Nueva contraseña
                                        <input type="password" id="passNueva" autocomplete="new-password" minlength="8">
                                    </label>
                                    <label>Confirmar nueva
                                        <input type="password" id="passConfirmar" autocomplete="new-password" minlength="8">
                                    </label>
                                </div>
                            </div>

                            <p class="mensaje" id="mensajePerfil"></p>

                            <div class="acciones-form">
                                <button type="button" class="btn-eliminar" id="btnCancelarEdicion">Descartar
                                    cambios</button>
                                <button type="submit" class="btn-guardar">Guardar cambios</button>
                            </div>
                        </form>

                    </div>
                </div>

                <aside class="tarjeta-eventos">
                    <div class="eventos-header">
                        <h2>Tus eventos</h2>
                        <span class="eventos-contador" id="eventosContador">0</span>
                    </div>

                    <div class="eventos-lista" id="eventosLista">
                        <p class="eventos-vacio">Cargando eventos…</p>
                    </div>

                    <a href="/eventos" class="eventos-vertodos">Ver todos los eventos</a>
                </aside>

            </div>
        </div>
    </main>
</body>

</html>
