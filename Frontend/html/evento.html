<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplicativo Web para la gestión de eventos (bodas, cumpleaños y reuniones)">
    <link rel="stylesheet" href="/css/menu.css">
    <script src="/js/sesion.js"></script>
    <link rel="stylesheet" href="/css/alertas.css">
    <script src="/js/alertas.js" defer></script>
    <link rel="stylesheet" href="/css/evento.css">
    <script src="/js/menu.js" defer></script>
    <script src="/js/evento.js" defer></script>
    <title>Portal Eve</title>
</head>

<body>
    <header>
        <div class="logo">
        </div>
        <div class="usuario">
        </div>

        <nav>
            <ul class="menu">
                <li>
                    <a href="/panel">
                        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                            <polyline points="9 22 9 12 15 12 15 22" />
                        </svg>
                        <span>Inicio</span>
                    </a>
                </li>
                <li>
                    <a href="/eventos">
                        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                        </svg>
                        <span>Eventos</span>
                    </a>
                </li>
                <li>
                    <a href="/calendario">
                        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                            <circle cx="12" cy="15" r="1" />
                            <circle cx="16" cy="15" r="1" />
                            <circle cx="8" cy="15" r="1" />
                        </svg>
                        <span>Calendario</span>
                    </a>
                </li>
                <li>
                    <a href="/configuracion">
                        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3" />
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                        </svg>
                        <span>Configuración</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="contenido">
            <div class="topInfo">
                <p id="usuario">Tus eventos</p>
                <button class="btn-crear" id="btnAbrirModal">+ Crear evento</button>
            </div>

            <!-- From Uiverse.io by alexruix -->
            <div class="group">
                <svg class="icon" aria-hidden="true" viewBox="0 0 24 24">
                    <g>
                        <path d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9
                             4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 
                             11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z">
                        </path>
                    </g>
                </svg>
                <input placeholder="Buscar" type="search" class="input">
            </div>

            <div class="cards">

            </div>





            <div class="modal" id="modalCrear">
                <div class="modal-contenido">
                    <div class="modal-header">
                        <h2>Crear nuevo evento</h2>
                        <button type="button" class="btn-cerrar" id="btnCerrarModal">&times;</button>
                    </div>
                    <form id="formEvento">
                        <label>Nombre
                            <input type="text" id="nombre" required>
                        </label>
                        <label>Descripción
                            <textarea id="descripcion"></textarea>
                        </label>
                        <label>Fecha
                            <input type="datetime-local" id="fecha" required>
                        </label>
                        <label>Lugar
                            <input type="text" id="lugar">
                        </label>
                        <label>Imagen
                            <input type="file" id="imagen" accept="image/*">
                        </label>
                        <label>Presupuesto
                            <input type="number" id="presupuesto" min="0">
                        </label>
                        <button type="submit" class="btn-guardar">Guardar evento</button>
                    </form>
                </div>
            </div>





        </div>
    </main>
</body>

</html>
